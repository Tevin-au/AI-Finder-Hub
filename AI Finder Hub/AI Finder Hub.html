<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Finder Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Tiempos+Headline:wght@400&family=Geist:wght@400;500&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --canvas: #000000;
            --ink: #fcfdff;
            --body: rgba(252, 253, 255, 0.86);
            --surface-card: #0a0a0c;
            --surface-elevated: #101012;
            --surface-deep: #06060a;
            --hairline: rgba(255, 255, 255, 0.06);
            --hairline-strong: rgba(255, 255, 255, 0.14);
            --primary: #fcfdff;
            --primary-on: #000000;
            --accent-blue: #3b9eff;
            --accent-blue-glow: rgba(0, 117, 255, 0.34);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Geist', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--canvas);
            color: var(--ink);
            line-height: 1.5;
        }

        .nav-bar {
            background-color: var(--canvas);
            padding: 0 32px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--hairline);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 10;
        }

        .nav-left { display: flex; align-items: center; }

        .back-btn { display: none; }

        .nav-bar .logo {
            font-family: 'Tiempos Headline', serif;
            font-size: 24px;
            font-weight: 400;
            color: var(--ink);
            text-decoration: none;
        }

        .user-info {
            display: none;
            align-items: center;
            gap: 16px;
        }

        .user-info.active { display: flex; }

        .user-name { font-family: 'Inter', sans-serif; font-size: 14px; color: var(--body); }

        .logout-btn {
            background-color: var(--surface-elevated);
            color: var(--ink);
            border: 1px solid var(--hairline-strong);
            padding: 6px 12px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            cursor: pointer;
        }

        .logout-btn:hover { background-color: var(--surface-card); }

        .hero {
            background-color: var(--canvas);
            padding: 128px 32px 96px;
            text-align: center;
            position: relative;
            margin-top: 64px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 600px;
            background: radial-gradient(ellipse at top, var(--accent-blue-glow) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero h1 {
            font-family: 'Tiempos Headline', serif;
            font-size: 96px;
            font-weight: 400;
            line-height: 1.0;
            letter-spacing: -0.96px;
            margin: 0 0 24px 0;
            color: var(--ink);
            position: relative;
        }

        .hero .subtitle {
            font-family: 'Geist', sans-serif;
            font-size: 20px;
            font-weight: 400;
            line-height: 1.3;
            margin: 0 0 48px 0;
            color: var(--body);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--primary-on);
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.43;
            cursor: pointer;
            display: inline-block;
            text-decoration: none;
            position: relative;
        }

        footer {
            background-color: var(--canvas);
            padding: 64px 32px;
            text-align: center;
            border-top: 1px solid var(--hairline);
        }

        footer p {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: rgba(252, 253, 255, 0.7);
            margin: 0;
        }

        /* Hide auth forms on the first page (login.html is separate) */
        .auth-section { display: none; }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-left">
            <button class="back-btn" onclick="history.back()">← Back</button>
            <a href="#" class="logo" onclick="window.location.href='AI Finder Hub.html'">AI Finder Hub</a>
        </div>
        <div class="user-info" id="user-info">
            <span class="user-name" id="user-name"></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <section id="hero" class="hero">
        <h1>AI Finder Hub</h1>
        <p class="subtitle">Discover AI tools quickly with clear reviews, guides, and smart recommendations.</p>
        <div style="margin-top:24px;" id="hero-actions">
            <a class="btn-primary" href="login.html">Let's Find AI Tools for You!</a>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 AI Finder Hub. All rights reserved.</p>
    </footer>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('user')) || null;

        window.addEventListener('DOMContentLoaded', function() {
            updateAuthUI();
        });

        function updateAuthUI() {
            const userInfo = document.getElementById('user-info');
            const userName = document.getElementById('user-name');

            if (currentUser) {
                userInfo.classList.add('active');
                userName.textContent = currentUser.name;
            } else {
                userInfo.classList.remove('active');
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('user');
            updateAuthUI();
            window.location.href = 'AI Finder Hub.html';
        }
    </script>
</body>
</html>
