<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Finder Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Tiempos+Headline:wght@400&family=Geist:wght@400;500&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --canvas: #000000;
            --ink: #fcfdff;
            --body: rgba(252, 253, 255, 0.86);
            --surface-card: #0a0a0c;
            --surface-elevated: #101012;
            --surface-deep: #06060a;
            --hairline: rgba(255, 255, 255, 0.06);
            --hairline-strong: rgba(255, 255, 255, 0.14);
            --primary: #fcfdff;
            --primary-on: #000000;
            --accent-blue: #3b9eff;
            --accent-blue-glow: rgba(0, 117, 255, 0.34);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Geist', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--canvas);
            color: var(--ink);
            line-height: 1.5;
        }

        .hero {
            background-color: var(--canvas);
            padding: 128px 32px;
            text-align: center;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 600px;
            background: radial-gradient(ellipse at top, var(--accent-blue-glow) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero h1 {
            font-family: 'Tiempos Headline', serif;
            font-size: 96px;
            font-weight: 400;
            line-height: 1.0;
            letter-spacing: -0.96px;
            margin: 0 0 24px 0;
            color: var(--ink);
        }

        .hero .subtitle {
            font-family: 'Geist', sans-serif;
            font-size: 20px;
            font-weight: 400;
            line-height: 1.3;
            margin: 0 0 48px 0;
            color: var(--body);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--primary-on);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.43;
            cursor: pointer;
            display: inline-block;
            text-decoration: none;
        }

        .section {
            padding: 96px 32px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section h2 {
            font-family: 'Tiempos Headline', serif;
            font-size: 76.8px;
            font-weight: 400;
            line-height: 1.0;
            letter-spacing: -0.768px;
            margin: 0 0 48px 0;
            color: var(--ink);
        }

        .section p {
            font-family: 'Geist', sans-serif;
            font-size: 18px;
            font-weight: 400;
            line-height: 1.5;
            color: var(--body);
            max-width: 800px;
            margin: 0 auto;
        }

        .feature-card {
            background-color: var(--surface-card);
            border: 1px solid var(--hairline-strong);
            border-radius: 12px;
            padding: 32px;
            margin: 24px 0;
            color: var(--ink);
        }

        .feature-card h3 {
            font-family: 'Inter', sans-serif;
            font-size: 24px;
            font-weight: 500;
            line-height: 1.5;
            margin: 0 0 16px 0;
        }

        .feature-card p {
            font-family: 'Geist', sans-serif;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
            color: var(--body);
        }

        .code-window {
            background-color: #06060a;
            border: 1px solid var(--hairline-strong);
            border-radius: 12px;
            padding: 24px;
            font-family: 'Geist Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: var(--body);
            margin: 24px 0;
        }

        .code-window .traffic-lights {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .code-window .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot.red { background-color: #ff2047; }
        .dot.yellow { background-color: #ffc53d; }
        .dot.green { background-color: #11ff99; }

        footer {
            background-color: var(--canvas);
            padding: 64px 32px;
            text-align: center;
            border-top: 1px solid var(--hairline);
        }

        footer p {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: rgba(252, 253, 255, 0.7);
            margin: 0;
        }

        .nav-bar {
            background-color: var(--canvas);
            padding: 0 32px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--hairline);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 10;
        }

        .nav-left {
            display: flex;
            align-items: center;
        }

        .back-btn {
            display: none;
        }

        .nav-bar .logo {
            font-family: 'Tiempos Headline', serif;
            font-size: 24px;
            font-weight: 400;
            color: var(--ink);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 24px;
        }

        .nav-links a {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--body);
            text-decoration: none;
        }

        .nav-links a:hover {
            color: var(--ink);
        }

        .hero {
            background-color: var(--canvas);
            padding: 128px 32px 96px;
            text-align: center;
            position: relative;
            margin-top: 64px;
        }

        .hero .actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            flex-wrap: wrap;
        }

        .action-description {
            max-width: 700px;
            margin: 0 auto 24px;
            font-family: 'Geist', sans-serif;
            font-size: 16px;
            color: var(--body);
            line-height: 1.6;
        }

        .btn-secondary {
            background-color: var(--surface-elevated);
            color: var(--ink);
            border: 1px solid var(--hairline-strong);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.43;
            cursor: pointer;
            text-decoration: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .card {
            background-color: var(--surface-card);
            border: 1px solid var(--hairline-strong);
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .card:hover {
            border-color: var(--ink);
        }

        .card h3 {
            font-family: 'Inter', sans-serif;
            font-size: 20px;
            font-weight: 500;
            margin: 0 0 8px 0;
            color: var(--ink);
        }

        .card p {
            font-family: 'Geist', sans-serif;
            font-size: 14px;
            color: var(--body);
            margin: 0;
        }

        .search-input {
            width: 100%;
            max-width: 400px;
            padding: 10px 14px;
            border: 1px solid var(--hairline-strong);
            border-radius: 8px;
            background-color: var(--surface-card);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }

        .tool-details {
            max-width: 800px;
            margin: 0 auto;
        }

        .tool-details h2 {
            font-family: 'Tiempos Headline', serif;
            font-size: 56px;
            font-weight: 400;
            line-height: 1.2;
            letter-spacing: -2.8px;
            margin: 0 0 24px 0;
        }

        .tool-details .meta {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .tool-details .meta span {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            color: rgba(252, 253, 255, 0.7);
        }

        .tool-details .description {
            font-family: 'Geist', sans-serif;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 48px;
        }

        .tabs {
            display: flex;
            gap: 24px;
            margin-bottom: 24px;
        }

        .tab {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--body);
            cursor: pointer;
            padding: 8px 0;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: var(--ink);
            border-bottom-color: var(--ink);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .review-form {
            background-color: var(--surface-card);
            border: 1px solid var(--hairline-strong);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .review-form h4 {
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            margin: 0 0 16px 0;
        }

        .review-form input, .review-form textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--hairline-strong);
            border-radius: 8px;
            background-color: var(--surface-deep);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .review-form textarea {
            height: 80px;
        }

        .reviews-list .review {
            background-color: var(--surface-card);
            border: 1px solid var(--hairline-strong);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .review .rating {
            color: #ffc53d;
            margin-bottom: 8px;
        }

        .hidden {
            display: none;
        }

        .description-section {
            padding: 96px 32px;
            text-align: center;
            background-color: var(--canvas);
        }

        .description-section p {
            font-family: 'Geist', sans-serif;
            font-size: 18px;
            font-weight: 400;
            line-height: 1.5;
            color: var(--body);
            max-width: 800px;
            margin: 0 auto;
        }

        .auth-section {
            padding: 48px 32px;
            max-width: 400px;
            margin: 0 auto;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 24px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            background-color: var(--surface-card);
            border: 1px solid var(--hairline-strong);
            border-radius: 8px 8px 0 0;
            text-align: center;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--body);
        }

        .auth-tab.active {
            background-color: var(--surface-elevated);
            color: var(--ink);
            border-bottom-color: var(--surface-elevated);
        }

        .auth-form {
            background-color: var(--surface-card);
            border: 1px solid var(--hairline-strong);
            border-radius: 0 12px 12px 12px;
            padding: 32px;
        }

        .auth-form h3 {
            font-family: 'Inter', sans-serif;
            font-size: 20px;
            margin: 0 0 24px 0;
            text-align: center;
        }

        .auth-form input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--hairline-strong);
            border-radius: 8px;
            background-color: var(--surface-deep);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .auth-form input::placeholder {
            color: rgba(252, 253, 255, 0.5);
        }

        .auth-form button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: var(--primary-on);
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .user-info {
            display: none;
            align-items: center;
            gap: 16px;
        }

        .user-info.active {
            display: flex;
        }

        .user-name {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--body);
        }

        .logout-btn {
            background-color: var(--surface-elevated);
            color: var(--ink);
            border: 1px solid var(--hairline-strong);
            padding: 6px 12px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background-color: var(--surface-card);
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-left">
            <button class="back-btn" onclick="history.back()">← Back</button>
            <a href="#" class="logo" onclick="window.location.href='AI Finder Hub.html'">AI Finder Hub</a>
        </div>
        <nav class="nav-links" id="nav-links-auth">
            <a href="categories.html">Categories</a>

            <span class="user-name" id="user-name"></span>

    <section id="hero" class="hero">
        <h1>AI Finder Hub</h1>
        <p class="subtitle">Discover AI tools quickly with clear reviews, guides, and smart recommendations.</p>
        <div class="actions" style="display: none;">
            <button class="btn-primary" onclick="window.location.href='categories.html'">Let's find AI Tool for you!</button>
        </div>
    </section>

    <section class="auth-section">
        <div class="auth-tabs">
            <div class="auth-tab active" onclick="switchAuthTab('login')">Login</div>
            <div class="auth-tab" onclick="switchAuthTab('signup')">Sign Up</div>
        </div>
        <div class="auth-form" id="login-form">
            <h3>Login</h3>
            <input type="email" placeholder="Email" id="login-email">
            <input type="password" placeholder="Password" id="login-password">
            <button onclick="login()">Login</button>
        </div>
        <div class="auth-form hidden" id="signup-form">
            <h3>Sign Up</h3>
            <input type="text" placeholder="Name" id="signup-name">
            <input type="email" placeholder="Email" id="signup-email">
            <input type="password" placeholder="Password" id="signup-password">
            <button onclick="signup()">Sign Up</button>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 AI Finder Hub. All rights reserved.</p>
    </footer>

    <script>

            },

            },

            {

                category: 'Text Processing',

            },
            {
                name: 'WordGrinder',
                category: 'Text Processing',
                description: 'Minimalist text editor designed for distraction-free writing in a terminal environment',
                articles: ['Using WordGrinder for focused writing', 'WordGrinder tips and tricks'],
                reviews: [{ rating: 4, comment: 'Perfect for focused writing without distractions' }]
            },
            {
                name: 'LibreOffice Writer',
                category: 'Text Processing',
                description: 'Full-featured open-source word processor for creating professional documents with advanced tools',
                articles: [''],
                reviews: [{ rating: 5, comment: 'Powerful and free alternative to Microsoft Word' }]
            },
            {
                name: 'Notepad++',
                category: 'Text Processing',
                description: 'Free text and code editor with syntax highlighting and advanced editing features',
                articles: ['Read this guide to learn more.'],
                reviews: [{ rating: 5, comment: 'Highly efficient for both text editing and coding' }]
            },
            { 
                name: 'GitHub Copilot', 
                category: 'Code Assistants', 
                description: 'AI code completion and suggestions', 
                articles: ['Setup guide', 'Best practices'], 
                reviews: [{ rating: 4, comment: 'Speeds up coding' }] 
            }
        ];

        let currentTool = null;
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        let registeredUsers = JSON.parse(localStorage.getItem('registeredUsers')) || [];
        let currentUser = JSON.parse(localStorage.getItem('user')) || null;

        // Check auth on page load
        window.addEventListener('DOMContentLoaded', function() {
            updateAuthUI();
            protectAuthPages();
        });

        function updateAuthUI() {
            const userInfo = document.getElementById('user-info');
            const navLinks = document.getElementById('nav-links-auth');
            const userName = document.getElementById('user-name');
            const authSection = document.querySelector('.auth-section');
            const heroActions = document.querySelector('.hero .actions');

            if (currentUser) {
                // User is logged in
                userInfo.classList.add('active');
                userName.textContent = currentUser.name;
                if (navLinks) navLinks.style.display = 'flex';
                if (authSection) authSection.classList.add('hidden');
                if (heroActions) heroActions.style.display = 'flex';
            } else {
                // User is not logged in
                userInfo.classList.remove('active');
                if (navLinks) navLinks.style.display = 'flex';
                if (authSection) authSection.classList.remove('hidden');
                if (heroActions) heroActions.style.display = 'none';
            }
        }

        function protectAuthPages() {
            // Check if accessing protected pages without login
            const currentPage = window.location.pathname.split('/').pop() || 'AI Finder Hub.html';
            const protectedPages = ['categories.html', 'tools.html', 'tool-details.html', 'favorites.html'];
            
            if (protectedPages.includes(currentPage) && !currentUser) {
                alert('Please log in first to access this page.');
                window.location.href = 'AI Finder Hub.html';
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('user');
            updateAuthUI();
            window.location.href = 'AI Finder Hub.html';
        }

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.add('hidden'));
            document.getElementById(sectionId).classList.remove('hidden');
            if (sectionId === 'categories') renderCategories();
            if (sectionId === 'tools') renderTools();
            if (sectionId === 'favorites') renderFavorites();
        }

        function renderCategories() {
            const grid = document.getElementById('categories-grid');
            grid.innerHTML = categories.map(cat => `
                <div class="card" onclick="selectCategory('${cat.name}')">
                    <h3>${cat.name}</h3>
                    <p>${cat.description}</p>
                </div>
            `).join('');
        }

        function selectCategory(categoryName) {
            showSection('tools');
            filterTools('', categoryName);
        }

        function renderTools(toolsList = tools) {
            const grid = document.getElementById('tools-grid');
            grid.innerHTML = toolsList.map(tool => `
                <div class="card" onclick="showToolDetails('${tool.name}')">
                    <h3>${tool.name}</h3>
                    <p>${tool.description}</p>
                    <span>${tool.category}</span>
                </div>
            `).join('');
        }

        function filterTools(query, category = '') {
            let filtered = tools;
            if (query) {
                filtered = filtered.filter(tool => tool.name.toLowerCase().includes(query.toLowerCase()));
            }
            if (category) {
                filtered = filtered.filter(tool => tool.category === category);
            }
            renderTools(filtered);
        }

        function showToolDetails(toolName) {
            currentTool = tools.find(t => t.name === toolName);
            const content = document.getElementById('tool-details-content');
            content.innerHTML = `
                <h2>${currentTool.name}</h2>
                <div class="meta">
                    <span>Category: ${currentTool.category}</span>
                    <span>Reviews: ${currentTool.reviews.length}</span>
                </div>
                <p class="description">${currentTool.description}</p>
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('articles')">Articles</div>
                    <div class="tab" onclick="switchTab('reviews')">Reviews</div>
                </div>
                <div id="articles" class="tab-content active">
                    ${currentTool.articles.map(article => `<div class="card"><h3>${article}</h3><p>Read this guide to learn more.</p></div>`).join('')}
                </div>
                <div id="reviews" class="tab-content">
                    <div class="review-form">
                        <h4>Write a Review</h4>
                        <input type="number" min="1" max="5" placeholder="Rating (1-5)" id="rating">
                        <textarea placeholder="Your comment" id="comment"></textarea>
                        <button class="btn-primary" onclick="submitReview()">Submit</button>
                    </div>
                    <div class="reviews-list">
                        ${currentTool.reviews.map(review => `
                            <div class="review">
                                <div class="rating">${'★'.repeat(review.rating)}${'☆'.repeat(5-review.rating)}</div>
                                <p>${review.comment}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <button class="btn-secondary" onclick="toggleFavorite('${currentTool.name}')">${favorites.includes(currentTool.name) ? 'Remove from Favorites' : 'Add to Favorites'}</button>
            `;
            showSection('tool-details');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${tabName}')"]`).classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        function submitReview() {
            const rating = document.getElementById('rating').value;
            const comment = document.getElementById('comment').value;
            if (rating && comment) {
                currentTool.reviews.push({ rating: parseInt(rating), comment });
                showToolDetails(currentTool.name); // Refresh
            }
        }

        function toggleFavorite(toolName) {
            if (favorites.includes(toolName)) {
                favorites = favorites.filter(f => f !== toolName);
            } else {
                favorites.push(toolName);
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            if (currentTool) showToolDetails(currentTool.name);
        }

        function renderFavorites() {
            const grid = document.getElementById('favorites-grid');
            const favTools = tools.filter(t => favorites.includes(t.name));
            grid.innerHTML = favTools.length ? favTools.map(tool => `
                <div class="card" onclick="showToolDetails('${tool.name}')">
                    <h3>${tool.name}</h3>
                    <p>${tool.description}</p>
                </div>
            `).join('') : '<p>No favorites yet.</p>';
        }

        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.add('hidden'));
            document.querySelector(`.auth-tab[onclick="switchAuthTab('${tab}')"]`).classList.add('active');
            document.getElementById(`${tab}-form`).classList.remove('hidden');
        }

        function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            if (!email || !password) {
                alert('Please fill in all fields.');
                return;
            }

            // Check if user exists
            const user = registeredUsers.find(u => u.email === email);
            if (!user) {
                alert('Email not registered. Please sign up first.');
                document.getElementById('login-email').value = '';
                document.getElementById('login-password').value = '';
                return;
            }

            // Verify password
            if (user.password !== password) {
                alert('Incorrect password.');
                document.getElementById('login-password').value = '';
                return;
            }

            // Login successful
            currentUser = { name: user.name, email: user.email };
            localStorage.setItem('user', JSON.stringify(currentUser));
            document.querySelector('.auth-section').classList.add('hidden');
            document.querySelector('.hero .actions').style.display = 'flex';
            alert('Logged in successfully!');
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
        }

        function isValidEmail(email) {
            // Regular expression for valid email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function signup() {
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            if (!name || !email || !password) {
                alert('Please fill in all fields.');
                return;
            }

            // Validate email format
            if (!isValidEmail(email)) {
                alert('Please enter a valid email address (e.g., user@example.com).');
                document.getElementById('signup-email').value = '';
                return;
            }

            // Check if email already exists
            const emailExists = registeredUsers.some(u => u.email === email);
            if (emailExists) {
                alert('This email is already registered. Please use a different email or log in.');
                document.getElementById('signup-email').value = '';
                return;
            }

            // Register new user
            registeredUsers.push({ name, email, password });
            localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));

            // Login the user
            currentUser = { name, email };
            localStorage.setItem('user', JSON.stringify(currentUser));
            document.querySelector('.auth-section').classList.add('hidden');
            document.querySelector('.hero .actions').style.display = 'flex';
            alert('Account created and logged in successfully!');
            document.getElementById('signup-name').value = '';
            document.getElementById('signup-email').value = '';
            document.getElementById('signup-password').value = '';
        }
    </script>
</body>
</html>
